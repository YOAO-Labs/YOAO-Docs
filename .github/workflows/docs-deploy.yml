name: Docs pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      yoao_ref:
        description: "YOAO-Labs/YOAO git ref to check out"
        required: false
        default: "dev"
      plugins_ref:
        description: "YOAO-Labs/YOAO-Plugins git ref to check out"
        required: false
        default: "main"
      sdk_ref:
        description: "YOAO-Labs/Plugin-SDK git ref to check out"
        required: false
        default: "main"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Docs pages build
    runs-on: ubuntu-latest
    env:
      YOAO_REPO_PATH: ${{ github.workspace }}/_sources/YOAO
      YOAO_PLUGINS_REPO_PATH: ${{ github.workspace }}/_sources/YOAO-Plugins
      YOAO_PLUGIN_SDK_REPO_PATH: ${{ github.workspace }}/_sources/Plugin-SDK
      DOCS_BASE: /YOAO-Docs/
    steps:
      - name: Checkout YOAO-Docs
        uses: actions/checkout@v4

      - name: Checkout YOAO source
        uses: actions/checkout@v4
        with:
          repository: YOAO-Labs/YOAO
          ref: ${{ inputs.yoao_ref || 'dev' }}
          path: _sources/YOAO

      - name: Checkout YOAO-Plugins source
        uses: actions/checkout@v4
        with:
          repository: YOAO-Labs/YOAO-Plugins
          ref: ${{ inputs.plugins_ref || 'main' }}
          path: _sources/YOAO-Plugins

      - name: Checkout Plugin-SDK source
        uses: actions/checkout@v4
        with:
          repository: YOAO-Labs/Plugin-SDK
          ref: ${{ inputs.sdk_ref || 'main' }}
          path: _sources/Plugin-SDK

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VitePress
        run: pnpm build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    name: Docs pages deployment
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
