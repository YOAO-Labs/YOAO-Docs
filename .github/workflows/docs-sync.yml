name: Docs sync

on:
  repository_dispatch:
    types: [yoao-docs-sync]
  workflow_dispatch:
    inputs:
      ref:
        description: "YOAO-Labs/YOAO ref to sync from"
        required: false
        default: "dev"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Docs source sync
    runs-on: ubuntu-latest
    env:
      YOAO_REPO_PATH: ${{ github.workspace }}/_yoao-source
    steps:
      - name: Checkout YOAO-Docs
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout YOAO source
        uses: actions/checkout@v4
        with:
          repository: YOAO-Labs/YOAO
          ref: ${{ inputs.ref || github.event.client_payload.ref || 'dev' }}
          path: _yoao-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate tracked docs from YOAO source
        run: |
          pnpm gen
          pnpm gen:env-vars
          python3 scripts/generate-training-reference.py

      - name: Check for tracked changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synced generated docs to main
        if: steps.diff.outputs.changed == 'true'
        env:
          SOURCE_REF: ${{ inputs.ref || github.event.client_payload.ref || 'dev' }}
          SOURCE_SHA: ${{ github.event.client_payload.sha || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(docs): sync generated docs from YOAO (${SOURCE_REF})"
          git push origin main

      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.ref || github.event.client_payload.ref || 'dev' }}
        run: gh workflow run docs-deploy.yml --ref main -f yoao_ref="${SOURCE_REF}"
