name: Docs sync

on:
  repository_dispatch:
    types: [yoao-docs-sync, yoao-plugins-docs-sync, plugin-sdk-docs-sync]
  workflow_dispatch:
    inputs:
      ref:
        description: "YOAO-Labs/YOAO ref to sync from"
        required: false
        default: "dev"
      plugins_ref:
        description: "YOAO-Labs/YOAO-Plugins ref to sync from"
        required: false
        default: "main"
      sdk_ref:
        description: "YOAO-Labs/Plugin-SDK ref to sync from"
        required: false
        default: "main"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Docs source sync
    if: github.event_name != 'repository_dispatch' || github.event.action != 'yoao-docs-sync' || github.event.client_payload.ref != 'main'
    runs-on: ubuntu-latest
    env:
      YOAO_REPO_PATH: ${{ github.workspace }}/_sources/YOAO
      YOAO_PLUGINS_REPO_PATH: ${{ github.workspace }}/_sources/YOAO-Plugins
      YOAO_PLUGIN_SDK_REPO_PATH: ${{ github.workspace }}/_sources/Plugin-SDK
    steps:
      - name: Checkout YOAO-Docs
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout YOAO source
        uses: actions/checkout@v4
        with:
          repository: YOAO-Labs/YOAO
          ref: ${{ inputs.ref || 'dev' }}
          path: _sources/YOAO

      - name: Checkout YOAO-Plugins source
        uses: actions/checkout@v4
        with:
          repository: YOAO-Labs/YOAO-Plugins
          ref: ${{ inputs.plugins_ref || (github.event.action == 'yoao-plugins-docs-sync' && github.event.client_payload.ref) || 'main' }}
          path: _sources/YOAO-Plugins

      - name: Checkout Plugin-SDK source
        uses: actions/checkout@v4
        with:
          repository: YOAO-Labs/Plugin-SDK
          ref: ${{ inputs.sdk_ref || (github.event.action == 'plugin-sdk-docs-sync' && github.event.client_payload.ref) || 'main' }}
          path: _sources/Plugin-SDK

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python3 -m pip install --quiet "pydantic>=2.5"

      - name: Regenerate tracked docs from upstream repositories
        run: |
          pnpm gen
          pnpm gen:env-vars
          pnpm gen:plugins
          python3 scripts/generate-training-reference.py

      - name: Check for tracked changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synced generated docs to main
        if: steps.diff.outputs.changed == 'true'
        env:
          SOURCE_REPO: ${{ github.event.action || 'manual' }}
          SOURCE_REF: ${{ (github.event.action == 'yoao-docs-sync' && 'dev') || github.event.client_payload.ref || inputs.ref || 'dev' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(docs): sync generated docs (${SOURCE_REPO} @ ${SOURCE_REF})"
          git push origin main

      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
          YOAO_REF: ${{ inputs.ref || 'dev' }}
          PLUGINS_REF: ${{ inputs.plugins_ref || (github.event.action == 'yoao-plugins-docs-sync' && github.event.client_payload.ref) || 'main' }}
          SDK_REF: ${{ inputs.sdk_ref || (github.event.action == 'plugin-sdk-docs-sync' && github.event.client_payload.ref) || 'main' }}
        run: >-
          gh workflow run docs-deploy.yml --ref main
          -f yoao_ref="${YOAO_REF}"
          -f plugins_ref="${PLUGINS_REF}"
          -f sdk_ref="${SDK_REF}"
